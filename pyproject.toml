[project]
name = "tengentoppaanimango"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework==3.18.0",
    "httpx==0.28.1",
    "markdown==3.10.3",
    "martor==1.8.2",
    "mysqlclient==2.2.8",
    "nh3==0.3.7",
    "pillow==12.3.0",
    "uvicorn==0.52.4",
]

[project.scripts]
manage = "manage:main"
tengentoppaanimango = "manage:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "apps", "services"]
py-modules = ["manage"]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
]

